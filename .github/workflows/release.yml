# Сборка бинарников и публикация GitHub Release по git-тегу (v*).
# Ассеты: mvi-{linux,darwin}-{amd64,arm64}.tar.gz — их качает install.sh,
# если на машине нет Go.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go vet ./...
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o mvi .

      - name: Package
        run: tar -czf "mvi-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" mvi

      - uses: actions/upload-artifact@v4
        with:
          name: mvi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mvi-*.tar.gz
          if-no-files-found: error

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    name: publish release
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
